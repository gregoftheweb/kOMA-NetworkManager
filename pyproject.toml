# Tooling config only: komanet is a single stdlib-only script, not a package.
[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["contents/code/komanet"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # CLI dispatch is long by nature
  "PLC0415",  # lazy imports keep `list` fast
  "E701", "E702",  # compact one-line CBOR cases
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
